name: sangria
services:
  server:
    build: ./server
    volumes:
      - ./server/database:/app/database
      - ./server/uploads:/app/uploads
    ports:
      - 3000:3000
      - 9229:9229
    networks:
      - dev
    develop:
      watch:
        - action: sync+restart
          path: ./server
          target: ./app
          ignore:
            - node_modules/
            - uploads/
